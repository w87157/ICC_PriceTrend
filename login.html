<!DOCTYPE html>
<html lang="en">
<!-- (Head 區塊，請複製 index.html 的 <head>...) -->
<head>
    <meta charset="utf-8">
    <title>MultiShop - 登入與註冊</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">  
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Topbar Start -->
    <!-- (複製 index.html 的 Topbar，這裡省略以節省空間，請記得保留 Topbar) -->
    <div class="container-fluid">
        <div class="row align-items-center bg-light py-3 px-xl-5 d-none d-lg-flex">
            <div class="col-lg-4">
                <a href="index.html" class="text-decoration-none">
                    <span class="h1 text-uppercase text-primary bg-dark px-2">Multi</span>
                    <span class="h1 text-uppercase text-dark bg-primary px-2 ml-n1">Shop</span>
                </a>
            </div>
            <!-- ... -->
        </div>
    </div>
    <!-- Topbar End -->

    <!-- Navbar Start -->
    <!-- (複製 index.html 的 Navbar，這裡省略以節省空間，請記得保留 Navbar) -->
    <!-- Navbar End -->

    <!-- Breadcrumb Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="index.html">首頁</a>
                    <span class="breadcrumb-item active">登入與註冊</span>
                </nav>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->
    <!-- Login Start -->
    <div class="container-fluid">
        <div class="row justify-content-center px-xl-5">
            <div class="col-lg-6 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3 text-center"><span class="bg-secondary pr-3">會員登入</span></h5>
                <div class="bg-light p-30 mb-5">
                    <form action="index-logged-in.html" method="GET"> <!-- 模擬登入跳轉 -->
                        <div class="row">
                            <div class="col-md-12 form-group">
                                <label>電子郵件</label>
                                <input class="form-control" type="email" placeholder="example@email.com" required>
                            </div>
                            <div class="col-md-12 form-group">
                                <label>密碼</label>
                                <input class="form-control" type="password" placeholder="請輸入密碼" required>
                            </div>
                            <div class="col-md-12 form-group d-flex justify-content-between align-items-center">
                                <div class="custom-control custom-checkbox">
                                    <input type="checkbox" class="custom-control-input" id="remember">
                                    <label class="custom-control-label" for="remember">記住我</label>
                                </div>
                                <a href="#">忘記密碼？</a>
                            </div>
                            <div class="col-md-12 mt-3">
                                <button type="submit" class="btn btn-block btn-primary font-weight-bold py-3">登入</button>
                            </div>
                            <div class="col-md-12 mt-3 text-center">
                                <span>還沒有帳號嗎？</span> <a href="register.html" class="text-primary font-weight-bold">立即註冊</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Login End -->
    <!-- Footer Start -->
    <!-- (複製 index.html 的 Footer，這裡省略以節省空間) -->
    <!-- Footer End -->

    <!-- JavaScript Libraries -->
    <!-- (複製 index.html 的 script 標籤) -->
</body>
</html>
