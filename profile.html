<!DOCTYPE html>
<html lang="en">
<!-- (Head 區塊，請複製 index.html 的 <head>...) -->
<head>
    <meta charset="utf-8">
    <title>MultiShop - 會員中心</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <!-- ... 其他 head 標籤 ... -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Topbar 這裡使用與 index-logged-in.html 相同的已登入狀態 Topbar -->
    <div class="container-fluid">
        <div class="row bg-secondary py-1 px-xl-5">
            <!-- ... 省略左側選單 ... -->
            <div class="col-lg-6 text-center text-lg-right">
                <div class="d-inline-flex align-items-center">
                    <!-- 已登入狀態的選單 -->
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown">
                            <i class="fas fa-user text-primary mr-1"></i> Hello, John
                        </button>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a class="dropdown-item" href="profile.html">會員中心</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="index.html">登出</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- ... 搜尋列等 ... -->
    </div>

    <!-- Navbar Start (請複製 index.html 的 Navbar) -->
    <!-- ... -->
    
    <!-- Breadcrumb Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="index-logged-in.html">首頁</a>
                    <span class="breadcrumb-item active">會員中心</span>
                </nav>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Profile Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <!-- 側邊選單 -->
            <div class="col-lg-3 col-md-4 mb-5">
                <div class="bg-light p-4 mb-30 h-100">
                    <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                        <a class="nav-link active bg-primary text-dark font-weight-bold mb-2" id="v-pills-profile-tab" data-toggle="pill" href="#v-pills-profile" role="tab">
                            <i class="fas fa-id-card mr-2"></i>個人資料
                        </a>
                        <a class="nav-link text-dark font-weight-bold mb-2" id="v-pills-orders-tab" data-toggle="pill" href="#v-pills-orders" role="tab">
                            <i class="fas fa-box-open mr-2"></i>訂單紀錄
                        </a>
                        <a class="nav-link text-dark font-weight-bold" id="v-pills-settings-tab" data-toggle="pill" href="#v-pills-settings" role="tab">
                            <i class="fas fa-cog mr-2"></i>帳號設定
                        </a>
                    </div>
                </div>
            </div>

            <!-- 內容區域 -->
            <div class="col-lg-9 col-md-8 mb-5">
                <div class="tab-content bg-light p-30 h-100" id="v-pills-tabContent">
                    <!-- 個人資料 Tab -->
                    <div class="tab-pane fade show active" id="v-pills-profile" role="tabpanel">
                        <h4 class="mb-4">個人資料</h4>
                        <form id="profileForm">
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>名字</label>
                                    <input class="form-control" type="text" value="John">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>姓氏</label>
                                    <input class="form-control" type="text" value="Doe">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>電子郵件</label>
                                    <input class="form-control" type="email" value="example@email.com" readonly>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>手機號碼</label>
                                    <input class="form-control" type="text" placeholder="未設定">
                                </div>
                                <div class="col-md-12 form-group">
                                    <label>聯絡地址</label>
                                    <input class="form-control" type="text" placeholder="請輸入地址">
                                </div>
                                <div class="col-md-12 mt-3">
                                    <button class="btn btn-primary py-2 px-4">儲存變更</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- 訂單紀錄 Tab -->
                    <div class="tab-pane fade" id="v-pills-orders" role="tabpanel">
                        <h4 class="mb-4">最近訂單</h4>
                        <div class="table-responsive">
                            <table class="table table-bordered text-center mb-0">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>訂單編號</th>
                                        <th>日期</th>
                                        <th>總金額</th>
                                        <th>狀態</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="align-middle">#ORD-2045-001</td>
                                        <td class="align-middle">2023-10-25</td>
                                        <td class="align-middle">$150.00</td>
                                        <td class="align-middle"><span class="badge badge-success px-2 py-1">已出貨</span></td>
                                        <td class="align-middle"><a href="#" class="btn btn-sm btn-primary">查看</a></td>
                                    </tr>
                                    <tr>
                                        <td class="align-middle">#ORD-2045-002</td>
                                        <td class="align-middle">2023-11-02</td>
                                        <td class="align-middle">$320.00</td>
                                        <td class="align-middle"><span class="badge badge-warning px-2 py-1">處理中</span></td>
                                        <td class="align-middle"><a href="#" class="btn btn-sm btn-primary">查看</a></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 帳號設定 Tab -->
                    <div class="tab-pane fade" id="v-pills-settings" role="tabpanel">
                         <h4 class="mb-4">更改密碼</h4>
                         <form>
                            <div class="row">
                                <div class="col-md-12 form-group">
                                    <label>目前密碼</label>
                                    <input class="form-control" type="password">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>新密碼</label>
                                    <input class="form-control" type="password">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>確認新密碼</label>
                                    <input class="form-control" type="password">
                                </div>
                                <div class="col-md-12 mt-3">
                                    <button class="btn btn-primary py-2 px-4">更新密碼</button>
                                </div>
                            </div>
                         </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Profile End -->

    <!-- Footer Start (請複製 index.html 的 Footer) -->
    <!-- ... -->
    <!-- JavaScript Libraries -->
    <!-- (複製 index.html 的 script 標籤) -->
<!-- 模擬儲存個人資料的 Script -->
    <script>
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止表單跳轉刷新頁面
            alert('個人資料已成功儲存！(目前為前端模擬，實際儲存需待後端開發完成)');
        });
    </script>
</body>
</html>
