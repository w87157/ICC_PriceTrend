    <!-- Register Start -->
    <div class="container-fluid">
        <div class="row justify-content-center px-xl-5">
            <div class="col-lg-6 mb-5">
                <h5 class="section-title position-relative text-uppercase mb-3 text-center"><span class="bg-secondary pr-3">註冊新帳號</span></h5>
                <div class="bg-light p-30 mb-5">
                    <form action="index-logged-in.html" method="GET"> <!-- 模擬註冊跳轉 -->
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>名字</label>
                                <input class="form-control" type="text" placeholder="John" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>姓氏</label>
                                <input class="form-control" type="text" placeholder="Doe" required>
                            </div>
                            <div class="col-md-12 form-group">
                                <label>電子郵件</label>
                                <input class="form-control" type="email" placeholder="example@email.com" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>設定密碼</label>
                                <input class="form-control" type="password" placeholder="請設定密碼" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>確認密碼</label>
                                <input class="form-control" type="password" placeholder="請再次輸入密碼" required>
                            </div>
                            <div class="col-md-12 mt-3">
                                <button type="submit" class="btn btn-block btn-primary font-weight-bold py-3">建立帳號</button>
                            </div>
                            <div class="col-md-12 mt-3 text-center">
                                <span>已經有帳號了？</span> <a href="login.html" class="text-primary font-weight-bold">立即登入</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Register End -->
